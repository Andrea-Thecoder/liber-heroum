#--------------------------------------------------------------------
#            Application
#--------------------------------------------------------------------
spring.application.name=liber-heroum-api

#--------------------------------------------------------------------
#            Server
#--------------------------------------------------------------------
server.port=8080
server.servlet.context-path=/api/v1/liber-heroum-api

#--------------------------------------------------------------------
#            Logging
#--------------------------------------------------------------------
logging.level.root=INFO
logging.level.it.liberheroum=DEBUG

#--------------------------------------------------------------------
#            Actuator
#--------------------------------------------------------------------
# Actuator answers only on its own port, never published to the internet:
# Prometheus reads /actuator/prometheus from the internal network.
management.server.port=8081
management.endpoints.web.exposure.include=health,info,prometheus
management.endpoint.health.show-details=when-authorized
management.endpoint.health.roles=ADMIN
management.metrics.tags.application=${spring.application.name}
# Histogram buckets let Prometheus compute p95/p99 response times.
management.metrics.distribution.percentiles-histogram.http.server.requests=true

#--------------------------------------------------------------------
#            Database
#--------------------------------------------------------------------
spring.datasource.url=jdbc:postgresql://localhost:5432/liber-heroum-api?currentSchema=dev,public
spring.datasource.username=liber-heroum-api
spring.datasource.password=secret
spring.datasource.driver-class-name=org.postgresql.Driver
spring.flyway.enabled=true
spring.flyway.locations=classpath:dbinit/postgres

#--------------------------------------------------------------------
#            Upload (multipart)
#--------------------------------------------------------------------
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=11MB

#--------------------------------------------------------------------
#            Security (Keycloak)
#--------------------------------------------------------------------
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8180/realms/liber-heroum-dev
spring.security.oauth2.resourceserver.jwt.audiences=liber-heroum-backend

#--------------------------------------------------------------------
#            Keycloak admin (account deletion)
#--------------------------------------------------------------------
app.keycloak-admin.server-url=http://localhost:8180
app.keycloak-admin.realm=liber-heroum-dev
app.keycloak-admin.client-id=liber-heroum-backend-admin
app.keycloak-admin.client-secret=secret

#--------------------------------------------------------------------
#            CORS
#--------------------------------------------------------------------
app.cors.allowed-origins=http://localhost:5173

#--------------------------------------------------------------------
#            Storage (S3)
#--------------------------------------------------------------------
app.storage.endpoint=http://localhost:8333
app.storage.access-key=admin
app.storage.secret-key=secret
app.storage.bucket=diary-documents
app.storage.create-buckets=true

#--------------------------------------------------------------------
#            Character sheets
#--------------------------------------------------------------------
app.character-sheet.max-sheets-per-character=10

#--------------------------------------------------------------------
#            Character backgrounds
#--------------------------------------------------------------------
app.character-background.max-text-length=50000
app.character-background.max-content-size=300KB

#--------------------------------------------------------------------
#            Feedback
#--------------------------------------------------------------------
app.feedback.bucket=feedback-documents
app.feedback.max-files=3
app.feedback.max-total-file-size=5MB
app.feedback.max-technical-info-size=2KB
app.feedback.timezone=Europe/Rome
app.feedback.rate-limit-max-requests=5
app.feedback.rate-limit-window=1h
